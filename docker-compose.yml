# StockFlow v2 — full local stack.
#   docker compose up -d --build          everything
#   docker compose up -d postgres redis   infra only (run the API with pnpm dev:api)
#
# Host ports are configurable and default away from 5432/6379/4000 so this stack
# can run next to other local projects. They are bound to 127.0.0.1: the local stack
# ships demo accounts with a published password and must not be reachable from the LAN.
name: stockflow-v2

x-db-url: &db-url postgres://${POSTGRES_USER:-stockflow}:${POSTGRES_PASSWORD:-stockflow}@postgres:5432/${POSTGRES_DB:-stockflow}

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockflow}
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockflow} -d ${POSTGRES_DB:-stockflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One LLM interface (OpenAI-compatible) routed to AWS Bedrock. Starts without
  # credentials; calls fail until AWS_* is set in .env.
  litellm:
    restart: unless-stopped
    image: ghcr.io/berriai/litellm:v1.98.0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4001}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-stockflow-dev-change-me}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: applies migrations, then (local stack only) creates the demo
  # tenants, and exits. The API waits for it to succeed.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: stockflow-v2-api
    command:
      - sh
      - -c
      - node dist/cli/migrate.js && if [ "$$SEED_ALLOW" = "true" ]; then node dist/cli/seed.js; fi
    environment:
      DATABASE_URL: *db-url
      NODE_ENV: ${NODE_ENV:-development}
      # Demo accounts with a shared, well-known password. Local stack only.
      SEED_ALLOW: ${SEED_ALLOW:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-ChangeMe-123!}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    restart: unless-stopped
    image: stockflow-v2-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # Dev-only fallback so a fresh clone starts; set a real secret in .env.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      # Inside the network the gateway is a service name, not localhost. The API
      # boots whether or not LiteLLM is up — only copilot turns fail, and they fail
      # with a message rather than at startup.
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-stockflow-dev-change-me}
    ports:
      - "127.0.0.1:${API_PORT:-3100}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  redisdata:
